name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropzone-jar
          path: build/libs/dropzone-*.jar

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Drop Zone (latest build)
          body: |
            Forge 1.20.1 build of Drop Zone: Battle Royale Arsenal from commit ${{ github.sha }}.
            Download the jar below and put it in your Better MC `mods` folder (client and server).
          prerelease: false
          make_latest: true
          files: build/libs/dropzone-*.jar
