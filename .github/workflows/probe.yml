name: Probe MC internals
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up workspace (downloads + decompiles MC)
        run: chmod +x gradlew && ./gradlew compileJava --no-daemon -q || true
      - name: Probe
        run: |
          JAR=$(find ~/.gradle -name 'forge-1.20.1-*_mapped_official_1.20.1.jar' ! -name '*sources*' | head -1)
          m() { echo "=== $1 :: $2"; javap -c -p -cp "$JAR" "$1" | awk -v pat="$2" 'index($0,pat)&&/\(/{p=1} p{print} p&&/^$/{exit}' | grep -E "invoke|getfield|putfield|areturn|instanceof|ifnull|ifnonnull|ifeq|ifne|getstatic|^  [a-z]" | head -60; }
          m net.minecraft.world.entity.Mob "LivingEntity getControllingPassenger"
          m net.minecraft.world.entity.animal.Pig "LivingEntity getControllingPassenger"
          m net.minecraft.world.entity.animal.horse.AbstractHorse "LivingEntity getControllingPassenger"
          m net.minecraft.world.entity.LivingEntity "void travelRidden"
          m net.minecraft.world.entity.LivingEntity "Vec3 getRiddenInput"
          m net.minecraft.world.entity.LivingEntity "float getRiddenSpeed"
          m net.minecraft.world.entity.boss.enderdragon.phases.DragonHoverPhase "void begin"
          m net.minecraft.world.entity.boss.enderdragon.phases.DragonHoverPhase "Vec3 getFlyTargetLocation"
          m net.minecraft.world.entity.boss.enderdragon.phases.DragonHoverPhase "void doServerTick"
          m net.minecraft.world.entity.boss.enderdragon.EnderDragonPhaseManager "void setPhase"
          echo "=== dragon aiStep calls"; javap -c -p -cp "$JAR" net.minecraft.world.entity.boss.enderdragon.EnderDragon | awk '/public void aiStep\(/{p=1} p{print} p&&/^$/{exit}' | grep -E "invoke" | sed 's/.*Method //' | head -80
          echo "=== Entity.getPassengersRidingOffset"; javap -c -p -cp "$JAR" net.minecraft.world.entity.Entity | awk '/public double getPassengersRidingOffset/{p=1} p{print} p&&/^$/{exit}'
          echo "=== Dragon riding offset"; javap -p -cp "$JAR" net.minecraft.world.entity.boss.enderdragon.EnderDragon | grep -E "Riding|positionRider|canRide|rideable|addPassenger|canAddPassenger"
          echo "=== ForgeEvents"; unzip -l $(find ~/.gradle -name 'forge-1.20.1-47.2.0-universal.jar' | head -1) | grep -E "ExplosionEvent|EntityItemPickupEvent|LivingTickEvent|EntityInteract|TickEvent" | head
